[package]
name = "barrierefreies_webuntis"
version = "1.9.40"
edition = "2021"
authors = ["Lauju1909"]
description = "Barrierefreies WebUntis - WCAG 2.2 AAA & NVDA-Optimiert (High-Performance Rust Edition)"

[[bin]]
name = "Barrierefreies_WebUntis"
path = "src/main.rs"

[[bin]]
name = "Feedback_Zentrale"
path = "src/bin/feedback_zentrale.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["tokio", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json", "cookies", "multipart"], default-features = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
chrono = "0.4"
hmac = "0.12"
sha1 = "0.10"
open = "5.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
