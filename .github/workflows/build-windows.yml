name: Build Windows EXE & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Auto-Bump Version, Build Windows EXE & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Commit Message for Skip
        id: check_skip
        shell: bash
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$COMMIT_MSG" =~ "\[skip ci\]" ]] || [[ "$COMMIT_MSG" =~ "chore(release):" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto-Bump Version in version.json
        if: steps.check_skip.outputs.skip == 'false'
        id: bump
        shell: pwsh
        run: |
          $json = Get-Content version.json -Raw | ConvertFrom-Json
          $currentVer = $json.version
          $parts = $currentVer.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2] + 1
          $newVer = "$major.$minor.$patch"
          $json.version = $newVer
          $json.buildDate = (Get-Date -Format "yyyy-MM-dd")
          $json | ConvertTo-Json -Depth 10 | Set-Content version.json -Encoding utf8
          Write-Host "Bumped version from $currentVer to $newVer"
          "version=$newVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore(release): auto-bump version to v$newVer [skip ci]"
          git tag "v$newVer"
          git push origin main
          git push origin "v$newVer"

      - name: Determine Target Version
        id: get_version
        shell: pwsh
        run: |
          $json = Get-Content version.json -Raw | ConvertFrom-Json
          Write-Host "Target Version is: $($json.version)"
          "version=$($json.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Compile Windows EXEs with csc.exe
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          Write-Host "Compiling Barrierefreies_WebUntis.exe..."
          & $csc /target:winexe /out:Barrierefreies_WebUntis.exe Program.cs
          if (Test-Path FeedbackProgram.cs) {
            Write-Host "Compiling Feedback_Zentrale.exe..."
            & $csc /target:winexe /out:Feedback_Zentrale.exe FeedbackProgram.cs
          }
          Write-Host "Compilation successful!"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.version }}"
          name: "Barrierefreies WebUntis v${{ steps.get_version.outputs.version }}"
          files: |
            Barrierefreies_WebUntis.exe
            Feedback_Zentrale.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
